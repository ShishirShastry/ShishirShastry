<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="img" aria-labelledby="title desc"><title id="title">Section divider</title><desc id="desc">A thin gradient line with a travelling glow.</desc><style>.rs{display:none}
@keyframes k0{0%{transform:translate(-120px,0px);animation-timing-function:cubic-bezier(.37,0,.63,1)}100%{transform:translate(1120px,0px)}}
.bm{transform:translate(340.57px,0px);animation:k0 7s linear infinite;animation-delay:-2.6s}
@keyframes k1{0%{opacity:0.55;transform:translate(0px,0px) scale(0.8) rotate(45deg);animation-timing-function:cubic-bezier(.37,0,.63,1)}50%{opacity:1;transform:translate(0px,0px) scale(1.15) rotate(45deg);animation-timing-function:cubic-bezier(.37,0,.63,1)}100%{opacity:0.55;transform:translate(0px,0px) scale(0.8) rotate(45deg)}}
.gm{opacity:0.55;transform:translate(0px,0px) scale(0.8) rotate(45deg);animation:k1 3.5s linear infinite;animation-delay:0s;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ra{display:none}.rs{display:inline!important}}</style><defs><linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".3" stop-color="#7c5cff" stop-opacity="0.28"/><stop offset=".5" stop-color="#a63cff" stop-opacity="0.4"/><stop offset=".7" stop-color="#ef67a8" stop-opacity="0.28"/><stop offset="1" stop-color="#ff9d5c" stop-opacity="0"/></linearGradient><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".45" stop-color="#a63cff"/><stop offset=".7" stop-color="#ef67a8"/><stop offset="1" stop-color="#ff9d5c" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#a63cff" stop-opacity="0.3"/><stop offset="1" stop-color="#a63cff" stop-opacity="0"/></radialGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="m"><rect width="1000" height="24" fill="url(#fade)"/></mask><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="0.5" stop-color="#a63cff"/><stop offset="1" stop-color="#ef67a8"/></linearGradient></defs><rect x="0" y="11.5" width="1000" height="1" fill="url(#base)"/><g mask="url(#m)"><g class="bm"><ellipse cx="0" cy="12" rx="110" ry="9" fill="url(#glow)"/><rect x="-110" y="11" width="220" height="2" rx="1" fill="url(#beam)"/></g></g><rect x="496" y="8" width="8" height="8" rx="1.5" transform="rotate(45 500 12)" fill="#ffffff" stroke="url(#dg)" stroke-width="1.5"/><rect class="gm" x="498.25" y="10.25" width="3.5" height="3.5" rx=".6" fill="url(#dg)"/></svg>